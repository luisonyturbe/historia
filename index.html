                { q: "La Cuarta Cruzada es famosa por desviarse y saquear la ciudad cristiana de:", o: ["Constantinopla", "Jerusalén", "Roma", "Antioquía"], a: "Constantinopla" },
                { q: "¿Qué marcó el fin de los reinos cristianos en Oriente en 1291?", o: ["La caída de San Juan de Acre", "La tregua de Saladino", "La Peste Negra", "El saqueo de Constantinopla"], a: "La caída de San Juan de Acre" },
                { q: "Una consecuencia duradera de Las Cruzadas en Europa fue:", o: ["El conocimiento de nuevas rutas comerciales e ideas de Oriente", "La conquista permanente de Tierra Santa", "La unificación de la Iglesia Católica y Ortodoxa", "El fin del sistema feudal"], a: "El conocimiento de nuevas rutas comerciales e ideas de Oriente" }
            ],
            "estado-moderno": [
                { q: "¿En qué siglos se formó principalmente el Estado moderno?", o: ["Siglos XV y XVI", "Siglos X y XI", "Siglos V y VI", "Siglos XVIII y XIX"], a: "Siglos XV y XVI" },
                { q: "La causa principal del surgimiento del Estado moderno fue:", o: ["La crisis del feudalismo, que los reyes aprovecharon", "El éxito de las Cruzadas", "La expansión del Islam", "El poder absoluto de la Iglesia"], a: "La crisis del feudalismo, que los reyes aprovecharon" },
                { q: "Una característica clave del Estado moderno es:", o: ["La centralización del poder en un gobierno", "El poder fragmentado de los señores feudales", "La ausencia de fronteras definidas", "Un ejército de vasallos leales"], a: "La centralización del poder en un gobierno" },
                { q: "En las monarquías absolutas, el poder del rey se legitimaba por:", o: ["El derecho divino", "Una votación popular", "La aprobación del Papa", "La fuerza militar únicamente"], a: "El derecho divino" },
                { q: "¿Qué clase social emergente apoyó la centralización del poder real?", o: ["La burguesía", "El campesinado", "El clero", "La baja nobleza"], a: "La burguesía" },
                { q: "¿Qué doctrina económica buscaba fortalecer al Estado acumulando metales preciosos (oro y plata)?", o: ["Mercantilismo", "Feudalismo", "Capitalismo", "Humanismo"], a: "Mercantilismo" },
                { q: "El mercantilismo promovía que el Estado...", o: ["Interviniera y regulara el comercio", "No interviniera en la economía", "Distribuyera la tierra en feudos", "Financiara las artes y las ciencias"], a: "Interviniera y regulara el comercio" },
                { q: "El objetivo principal del mercantilismo era maximizar las...", o: ["Exportaciones", "Importaciones", "Guerras", "Alianzas religiosas"], a: "Exportaciones" },
                { q: "El Estado moderno se caracteriza por tener un ejército...", o: ["Nacional, profesional y permanente", "Compuesto por señores feudales y sus vasallos", "Temporal, solo en caso de guerra", "Controlado por la Iglesia"], a: "Nacional, profesional y permanente" },
                { q: "¿Qué impulso cultural ayudó a transformar las ideas de poder y gobernanza?", o: ["El Renacimiento", "El Gótico", "El Escolasticismo", "Las Cruzadas"], a: "El Renacimiento" }
            ],
            "renacimiento": [
                { q: "¿Qué movimiento intelectual y cultural del Renacimiento puso al ser humano en el centro del conocimiento?", o: ["Humanismo", "Mercantilismo", "Feudalismo", "Escolasticismo"], a: "Humanismo" },
                { q: "El Renacimiento se originó principalmente en las ciudades de:", o: ["Italia (Florencia, Roma)", "España (Madrid, Sevilla)", "Inglaterra (Londres, York)", "Francia (París, Lyon)"], a: "Italia (Florencia, Roma)" },
                { q: "¿Qué familia de mercaderes y banqueros fue famosa por financiar el arte en Florencia?", o: ["Los Médici", "Los Borgia", "Los Sforza", "Los Comneno"], a: "Los Médici" },
                { q: "¿Quién es el artista renacentista autor de la 'Mona Lisa' y 'La Última Cena'?", o: ["Leonardo da Vinci", "Miguel Ángel", "Rafael Sanzio", "Donatello"], a: "Leonardo da Vinci" },
                { q: "¿Qué artista esculpió el 'David' y pintó los frescos de la Capilla Sixtina?", o: ["Miguel Ángel", "Leonardo da Vinci", "Rafael Sanzio", "Tiziano"], a: "Miguel Ángel" },
                { q: "¿Qué astrónomo formuló la teoría heliocéntrica (la Tierra gira alrededor del Sol)?", o: ["Nicolás Copérnico", "Galileo Galilei", "Andreas Vesalio", "Ptolomeo"], a: "Nicolás Copérnico" },
                { q: "¿Quién es considerado el 'padre de la ciencia experimental' y defendió el heliocentrismo con un telescopio?", o: ["Galileo Galilei", "Nicolás Copérnico", "Johannes Gutenberg", "Nicolás Maquiavelo"], a: "Galileo Galilei" },
                { q: "¿Qué invento de Johannes Gutenberg permitió la difusión masiva del conocimiento?", o: ["La imprenta de tipos móviles", "El telescopio", "El microscopio", "El arado de vertedera"], a: "La imprenta de tipos móviles" },
                { q: "¿Qué autor analizó el poder de forma pragmática en su obra 'El Príncipe'?", o: ["Nicolás Maquiavelo", "William Shakespeare", "Miguel de Cervantes", "Dante Alighieri"], a: "Nicolás Maquiavelo" },
                { q: "Autor de 'Don Quijote de la Mancha', considerada la primera novela moderna:", o: ["Miguel de Cervantes", "William Shakespeare", "Nicolás Maquiavelo", "Petrarca"], a: "Miguel de Cervantes" }
            ]
        };

        // --- LÓGICA DE LA APLICACIÓN ---

        const app = document.getElementById('app');

        // Estado de la aplicación
        let currentQuizQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let incorrectAnswers = [];
        let quizActive = false; // Para evitar doble clic en opciones

        /**
         * Función para barajar un array (Algoritmo Fisher-Yates)
         * @param {Array} array - El array a barajar
         * @returns {Array} - El array barajado
         */
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            // Mientras queden elementos por barajar
            while (currentIndex != 0) {
                // Elegir un elemento restante
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                // E intercambiarlo con el elemento actual
                [array[currentIndex], array[randomIndex]] = [
                    array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        /**
         * Renderiza la página de inicio
         */
        function renderHome() {
            app.innerHTML = `
                <header class="text-center my-8 md:my-12">
                    <h1 class="text-4xl md:text-5xl font-bold text-blue-900">Guía de Estudio de Historia</h1>
                </header>
                <main>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">
                        <button class="topic-btn" data-topic="edad-media">
                            Edad Media
                        </button>
                        <button class="topic-btn" data-topic="feudalismo">
                            Feudalismo
                        </button>
                        <button class="topic-btn" data-topic="iglesia">
                            La Iglesia
                        </button>
                        <button class="topic-btn" data-topic="cruzadas">
                            Las Cruzadas
                        </button>
                        <button class="topic-btn" data-topic="estado-moderno">
                            Estado Moderno
                        </button>
                        <button class="topic-btn" data-topic="renacimiento">
                            Renacimiento
                        </button>
                    </div>
                    <div class="text-center mt-10">
                        <button id="general-quiz" class="bg-green-700 text-white font-bold py-4 px-8 rounded-lg shadow-lg hover:bg-green-800 transition-all text-xl">
                            Iniciar Quiz General
                        </button>
                    </div>
                </main>
            `;
        }

        /**
         * Renderiza la página de una sección de estudio
         * @param {string} topicKey - La clave del tema (ej. "edad-media")
         */
        function renderSection(topicKey) {
            const data = contentData[topicKey];
            if (!data) {
                console.error("Tema no encontrado:", topicKey);
                renderHome();
                return;
            }

            let summaryHtml = data.summary.map(module => `
                <div class="bg-white shadow-lg rounded-lg p-6 my-6">
                    <h3 class="text-2xl font-bold text-blue-800 mb-4">${module.title}</h3>
                    <ul class="list-disc list-inside ml-4 text-gray-700 space-y-3">
                        ${module.points.map(point => `<li>${point}</li>`).join('')}
                    </ul>
                </div>
            `).join('');

            app.innerHTML = `
                <header class="flex justify-between items-center mb-6">
                    <button id="back-home" class="bg-gray-500 text-white py-2 px-5 rounded-lg hover:bg-gray-600 transition-all font-medium">
                        &larr; Volver
                    </button>
                    <a href="${data.videoUrl}" target="_blank" class="bg-red-600 text-white py-2 px-5 rounded-lg hover:bg-red-700 transition-all font-medium">
                        Ver Video Informativo
                    </a>
                </header>
                <main>
                    <h2 class="text-4xl font-bold text-gray-800 mb-6">${data.title}</h2>
                    ${summaryHtml}
                    <div class="text-center mt-10 mb-6">
                        <button id="start-section-quiz" data-topic="${topicKey}" class="bg-green-700 text-white font-bold py-4 px-8 rounded-lg shadow-lg hover:bg-green-800 transition-all text-xl">
                            Iniciar Quiz de ${data.title}
                        </button>
                    </div>
                </main>
            `;
        }

        /**
         * Inicia el quiz, preparando las preguntas
         * @param {string} topicKey - La clave del tema o "general"
         */
        function startQuiz(topicKey) {
            currentQuestionIndex = 0;
            score = 0;
            incorrectAnswers = [];
            quizActive = true; // El quiz comienza

            if (topicKey === 'general') {
                // Combina todas las preguntas de todos los temas
                let allQuestions = Object.values(quizData).flat();
                // Baraja y toma 20
                currentQuizQuestions = shuffleArray(allQuestions).slice(0, 20);
            } else {
                let topicQuestions = quizData[topicKey] || [];
                // Baraja y toma 10
                currentQuizQuestions = shuffleArray(topicQuestions).slice(0, 10);
            }

            if (currentQuizQuestions.length === 0) {
                console.error("No se encontraron preguntas para:", topicKey);
                renderHome();
                return;
            }

            renderQuestion();
        }

        /**
         * Renderiza la pregunta actual del quiz
         */
        function renderQuestion() {
            if (currentQuestionIndex >= currentQuizQuestions.length) {
                renderResults();
                return;
            }

            quizActive = true; // Activa la pregunta
            const q = currentQuizQuestions[currentQuestionIndex];
            
            // Barajamos las opciones para que no aparezcan siempre en el mismo orden
            const shuffledOptions = shuffleArray([...q.o]);

            let optionsHtml = shuffledOptions.map(option => `
                <button class="quiz-option" data-answer="${option}">
                    ${option}
                </button>
            `).join('');

            app.innerHTML = `
                <div class="bg-white p-6 md:p-8 rounded-lg shadow-xl max-w-3xl mx-auto">
                    <header class="mb-6">
                        <p class="text-gray-600 font-medium">
                            Pregunta ${currentQuestionIndex + 1} de ${currentQuizQuestions.length}
                        </p>
                        <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mt-2">${q.q}</h2>
                    </header>
                    <main>
                        ${optionsHtml}
                    </main>
                    <footer class="mt-6 text-center">
                        <button id="quit-quiz" class="text-sm text-gray-500 hover:text-red-600">Abandonar Quiz</button>
                    </footer>
                </div>
            `;
        }

        /**
         * Maneja la selección de una respuesta
         * @param {string} selectedOption - El texto de la opción seleccionada
         */
        function handleAnswer(selectedOption) {
            if (!quizActive) return; // Evita doble clic
            quizActive = false; // Desactiva hasta la siguiente pregunta

            const q = currentQuizQuestions[currentQuestionIndex];
            const correctAnswer = q.a;

            const allOptions = document.querySelectorAll('.quiz-option');
            let selectedButton = null;

            allOptions.forEach(button => {
                const answer = button.dataset.answer;
                if (answer === selectedOption) {
                    selectedButton = button;
                }
                // Marca la correcta
                if (answer === correctAnswer) {
                    button.classList.add('correct');
                }
            });

            if (selectedOption === correctAnswer) {
                score++;
                selectedButton.classList.add('correct'); // Ya la tiene, pero por si acaso
            } else {
                // Guardamos la información del error
                incorrectAnswers.push({
                    question: q.q,
                    selected: selectedOption,
                    correct: correctAnswer
                });
                if (selectedButton) {
                    selectedButton.classList.add('incorrect');
                }
            }

            // Pausa de 1.5 segundos para ver el resultado antes de pasar
            setTimeout(() => {
                currentQuestionIndex++;
                renderQuestion();
            }, 1500);
        }

        /**
         * Renderiza la pantalla de resultados
         */
        function renderResults() {
            let incorrectHtml = '';
            if (incorrectAnswers.length > 0) {
                incorrectHtml = '<h3 class="text-2xl font-bold text-gray-800 mb-4">Respuestas incorrectas:</h3>';
                incorrectHtml += '<div class="space-y-6">';
                incorrectHtml += incorrectAnswers.map(item => `
                    <div class="bg-red-50 border border-red-200 p-4 rounded-lg">
                        <p class="font-bold text-red-900">${item.question}</p>
                        <p class="text-sm text-red-700 mt-2">Tu respuesta: <span class="font-semibold">${item.selected}</span></p>
                        <p class="text-sm text-green-700">Respuesta correcta: <span class="font-semibold">${item.correct}</span></p>
                    </div>
                `).join('');
                incorrectHtml += '</div>';
            } else {
                incorrectHtml = '<p class="text-lg text-green-700 font-semibold">¡Felicidades! ¡Todas las respuestas fueron correctas!</p>';
            }

            const percentage = Math.round((score / currentQuizQuestions.length) * 100);
            let resultColor = 'text-green-700';
            if (percentage < 80) resultColor = 'text-yellow-600';
            if (percentage < 60) resultColor = 'text-red-700';

            app.innerHTML = `
                <div class="bg-white p-6 md:p-10 rounded-lg shadow-xl text-center max-w-3xl mx-auto">
                    <h2 class="text-4xl font-bold text-gray-800 mb-4">Quiz Terminado</h2>
                    <p class="text-2xl text-gray-600 mb-6">Tu resultado:</p>
                    <p class="text-7xl font-bold ${resultColor} mb-8">
                        ${score} / ${currentQuizQuestions.length}
                    </p>
                    <div class="text-left my-10">
                        ${incorrectHtml}
                    </div>
                    <button id="back-home" class="bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg hover:bg-blue-800 transition-all text-xl">
                        Volver al Inicio
                    </button>
                </div>
            `;
        }

        // --- MANEJADOR DE EVENTOS PRINCIPAL (DELEGACIÓN) ---

        app.addEventListener('click', e => {
            // Botón para ir a una sección de tema
            const topicBtn = e.target.closest('.topic-btn');
            if (topicBtn) {
                const topicKey = topicBtn.dataset.topic;
                renderSection(topicKey);
                return;
            }

            // Botón para volver al inicio
            if (e.target.closest('#back-home')) {
                renderHome();
                return;
            }

            // Botón para iniciar quiz general
            if (e.target.closest('#general-quiz')) {
                startQuiz('general');
                return;
            }

            // Botón para iniciar quiz de sección
            const sectionQuizBtn = e.target.closest('#start-section-quiz');
            if (sectionQuizBtn) {
                const topicKey = sectionQuizBtn.dataset.topic;
                startQuiz(topicKey);
                return;
            }

            // Botón de opción de respuesta en un quiz
            const quizOption = e.target.closest('.quiz-option');
            if (quizOption && quizActive) { // Solo si el quiz está activo
                handleAnswer(quizOption.dataset.answer);
                return;
            }
            
            // Botón para abandonar el quiz
            if (e.target.closest('#quit-quiz')) {
                // Aquí podrías poner un modal de confirmación, pero por simplicidad
                // volvemos al inicio.
                renderHome();
                return;
            }
        });

        // --- INICIAR LA APLICACIÓN ---
        renderHome();

    </script>
</body>
</html>
