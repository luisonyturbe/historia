                    topics: {
                        'edad-media': {
                            title: 'Edad Media',
                            content: `
                                <div class="prose prose-custom" id="topic-text-edad-media">
                                    <div class="bg-blue-50 border-l-4 border-blue-400 p-6 rounded-lg mb-8">
                                        <h3 class="mt-0 text-blue-800">Video Informativo</h3>
                                        <p class="text-blue-700">Video sobre la Edad Media, Lealtad y Fe.</p>
                                        <a href="https://github.com/luisonyturbe/historia/raw/main/La_Edad_Media__Lealtad_y_Fe.mov" target="_blank" rel="noopener noreferrer" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-5 rounded-lg transition-colors">
                                            Ver Video
                                        </a>
                                    </div>
                                    
                                    <h2>Plan de Estudio: La Edad Media</h2>
                                    <p>El material de estudio se divide en cinco módulos principales, cubriendo desde la base económica hasta el legado de este periodo.</p>

                                    <h3>Módulo 1: El Corazón de la Economía Medieval</h3>
                                    <p>Este módulo se centra en cómo las personas subsistían y cómo se organizaba la producción fuera de las grandes urbes.</p>
                                    <p><strong>La Tierra:</strong> Era el <strong>corazón de la economía medieval</strong>; la vida giraba en torno a la agricultura. La mayoría de la gente vivía en el campo, cultivando para subsistir.</p>
                                    <p><strong>Avances Tecnológicos:</strong> El <strong>arado de vertedera</strong> y el <strong>molino de agua</strong> ayudaron a aumentar la producción agrícola, a pesar de que la vida rural seguía siendo dura.</p>
                                    <p><strong>Artesanía y Gremios:</strong> La artesanía floreció en pueblos y ciudades. Los artesanos (tejedores, herreros, zapateros, etc.) se agrupaban en <strong>gremios</strong>.</p>
                                    <p><strong>Función de los Gremios:</strong> Regulaban la calidad, el precio y la producción de sus oficios. Ser parte de un gremio era un honor y aseguraba un lugar en la sociedad.</p>

                                    <h3>Módulo 2: El Sistema Feudal y la Estructura Social</h3>
                                    <p>Este módulo explora la jerarquía social rígida y las relaciones de poder que definieron la sociedad medieval.</p>
                                    <p><strong>Feudalismo:</strong> No era un gobierno, sino una <strong>red de relaciones personales</strong> basada en la lealtad y la posesión de la tierra.</p>
                                    <p><strong>Señores Feudales:</strong> Eran los <strong>dueños de grandes extensiones de tierra (feudos)</strong>. Poseían el poder militar y judicial sobre sus dominios.</p>
                                    <p><strong>Vasallos:</strong> Juraban <strong>lealtad a un señor feudal</strong> a cambio de protección y una parte de la tierra. A menudo, un vasallo podía ser señor de sus propios dominios.</p>
                                    <p><strong>Siervos:</strong> Eran la <strong>gran mayoría</strong> de la población. Estaban <strong>atados a la tierra</strong> y requerían permiso de su señor para abandonarla. Su trabajo consistía en cultivar las tierras del señor, pagar impuestos y realizar trabajos forzados, a cambio del derecho a trabajar una parcela para sí mismos y recibir protección.</p>
                                    <p><strong>Pirámide Social Rígida:</strong> La sociedad era profundamente jerárquica con <strong>muy poca movilidad social</strong> (generalmente, se nacía y moría en la misma clase social). La jerarquía incluía al <strong>Rey</strong>, la <strong>Alta nobleza y altos clérigos</strong> (duques, condes, obispos), los <strong>Caballeros y baja nobleza</strong>, y finalmente los <strong>Campesinos, artesanos y siervos</strong>.</p>

                                    <h3>Módulo 3: La Cruz, la Espada y los Conflictos Religiosos</h3>
                                    <p>Este módulo aborda el papel central del cristianismo y el surgimiento del Islam, que culminó en Las Cruzadas.</p>
                                    <p><strong>Poder de la Iglesia Católica:</strong> El cristianismo era el <strong>centro de la vida</strong>, no solo una religión. La Iglesia Católica (encabezada por el Papa) tenía una <strong>autoridad inmensa</strong>, incluso por encima de los reyes. Controlaba la educación, la moralidad y poseía grandes extensiones de tierra. La vida diaria estaba marcada por los sacramentos, festividades y el temor al castigo divino.</p>
                                    <p><strong>Surgimiento del Islam:</strong> Una nueva fe que surgió en el siglo VII al otro lado del Mediterráneo. El control musulmán se extendió por Oriente Medio, el norte de África y parte de España.</p>
                                    <p><strong>Las Cruzadas:</strong> Fueron un <strong>choque de civilizaciones</strong> entre el cristianismo y el Islam. Se iniciaron a finales del siglo XI, cuando el Papa Urbano II convocó a los caballeros cristianos a "liberar" Tierra Santa. Estas fueron una serie de campañas militares que se sucedieron por casi 200 años.</p>

                                    <h3>Módulo 4: El Contraste de la Vida Diaria</h3>
                                    <p>Este módulo examina la disparidad en las condiciones de vida entre la nobleza y la población rural.</p>
                                    <p><strong>La Vida en los Castillos (Nobleza):</strong> Disfrutaban de privilegios y comodidades. Pasaban sus días celebrando elaborados <strong>banquetes</strong>, entrenando para la guerra y participando en <strong>torneos</strong>. También recibían a vasallos y otros nobles, además de administrar sus tierras y ejercer justicia.</p>
                                    <p><strong>La Vida en las Aldeas (Campesinos):</strong> Vivían en condiciones muy diferentes al lujo de la nobleza. Habitaban en pequeñas chozas con techos de paja y barro, a menudo compartidas con animales. Trabajaban <strong>de sol a sol</strong> en los campos y dependían completamente de las cosechas para sobrevivir.</p>
                                    <p><strong>Rutina Campesina:</strong> <strong>Pagaban impuestos y tributos</strong> a sus señores. Las festividades religiosas eran el único escape a su dura rutina. Sufrían las inclemencias del tiempo.</p>

                                    <h3>Módulo 5: Eventos que Marcaron el Final y el Legado</h3>
                                    <p>Este módulo cubre los grandes acontecimientos que precipitaron el declive del periodo medieval y su impacto duradero.</p>
                                    <p><strong>La Peste Negra (Siglo XIV):</strong> Una devastadora pandemia que <strong>diezmó a la población europea</strong>, matando aproximadamente a un tercio de sus habitantes. Provocó enormes cambios sociales y económicos que <strong>debilitaron el sistema feudal</strong>.</p>
                                    <p><strong>La Guerra de los Cien Años (1337-1453):</strong> Prolongado conflicto entre Inglaterra y Francia. Marcó el final del periodo medieval y el <strong>declive de la caballería tradicional</strong> frente a nuevas tácticas militares.</p>
                                    <p><strong>Legado: Cuna de Naciones:</strong> Durante este periodo se formaron muchas de las naciones europeas actuales, estableciéndose fronteras y desarrollando identidades nacionales.</p>
                                    <p><strong>Legado: Influencia Religiosa:</strong> El cristianismo moldeó profundamente la cultura, el arte y la política europea, dejando un legado que perdura.</p>
                                    <p><strong>Legado: Semilla del Renacimiento:</strong> La Edad Media fue el punto de partida para el Renacimiento, que traería consigo una revolución cultural e intelectual.</p>

                                    <div class="mt-12 text-center">

                                            Tomar el Quiz de Edad Media &rarr;
                                        </button>
                                    </div>
                                </div>
                            `

                        'feudalismo': {
                            title: 'El Feudalismo',
                            content: `
                                <div class="prose prose-custom" id="topic-text-feudalismo">
                                    <div class="bg-blue-50 border-l-4 border-blue-400 p-6 rounded-lg mb-8">
                                        <h3 class="mt-0 text-blue-800">Video Informativo</h3>
                                        <p class="text-blue-700">Video sobre el sistema feudal.</p>

                                            Ver Video
                                        </a>
                                    </div>

                                    <h2>Plan de Estudio: El Feudalismo</h2>

                                    <h3>I. Contexto y Definición</h3>
                                    <p><strong>Definición:</strong> El feudalismo fue el sistema dominante en las sociedades medievales europeas, vigente aproximadamente <strong>de los siglos X al XIII</strong>. Es una organización política, social y económica que se inicia en torno al siglo IX.</p>
                                    <p><strong>Base del Sistema:</strong> Se basaba en una jerarquía social establecida mediante el control administrativo local y la distribución de la tierra en unidades llamadas <strong>feudos</strong>.</p>
                                    <p><strong>Raíces Históricas:</strong> Tiene sus raíces en el sistema señorial romano (compensación de trabajadores con protección) y en el reino de los francos del siglo VIII, donde el rey entregaba tierras de por vida (<strong>benefice</strong>) a nobles leales.</p>

                                    <h3>II. Causas del Surgimiento</h3>
                                    <p><strong>Inseguridad:</strong> Miedo e inseguridad generados por las nuevas invasiones (vikingos y eslavos) en los siglos IX y X.</p>
                                    <p><strong>Debilidad Real:</strong> Los reinos europeos se debilitaron tras la desaparición del imperio Carolingio. Los reyes no podían garantizar la seguridad de sus súbditos, llevando a la unión de la gente para la defensa común.</p>
                                    <p><strong>Valor de la Tierra:</strong> Aumento del valor de la tierra debido a la desaparición del comercio y la inseguridad en los caminos.</p>

                                    <h3>III. Estructura Social y Jerarquía (La Pirámide Feudal)</h3>
                                    <p>El sistema establecía una división permanente de clases entre quienes poseían tierras y quienes las arrendaban.</p>
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Estamento</th>
                                                <th>Rol</th>
                                                <th>Características y Privilegios</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td><strong>Rey / Monarca</strong></td>
                                                <td>Cúspide del sistema y persona con más poder.</td>
                                                <td>Consideraba todas las tierras de Inglaterra (u otros reinos) como su propiedad personal.</td>
                                            </tr>
                                            <tr>
                                                <td><strong>Nobleza / Señores</strong></td>
                                                <td>Estamento privilegiado (Alta y Pequeña).</td>
                                                <td>Poseía tierras de la Corona a cambio de servicio militar. Vivían en castillos. Podían fragmentar posesiones o distanciarse de la corte.</td>
                                            </tr>
                                            <tr>
                                                <td><strong>Clero</strong></td>
                                                <td>Estamento privilegiado (Alto y Bajo).</td>
                                                <td>Se dedicaba a la oración. Monjes vivían en monasterios, copiaban libros (códices) y tenían tierras propias.</td>
                                            </tr>
                                            <tr>
                                                <td><strong>Vasallo</strong></td>
                                                <td>Persona que recibía un feudo.</td>
                                                <td>Prometía lealtad y servicio al señor a cambio de protección militar y legal. Recibía renta de la tierra y autoridad sobre sus habitantes.</td>
                                            </tr>
                                            <tr>
                                                <td><strong>Campesinos / Siervos</strong></td>
                                                <td>Estamentos no privilegiados. Constituían la gran mayoría de la población.</td>
                                                <td><strong>Siervos (Trabajadores no libres):</strong> Base de la pirámide. Obligados a vivir en las tierras de su señor, sin poder abandonarlas, y trabajaban sin remuneración para producir alimentos.</td>
                                            </tr>
                                        </tbody>
                                    </table>

                                    <h3>IV. Relaciones Clave: Señor y Vasallo</h3>
                                    <p><strong>Vínculo Personal:</strong> Un terrateniente (señor) entregaba un feudo a un vasallo, creando un vínculo personal donde el vasallo prometía lealtad y servicio.</p>
                                    <p><strong>Homenaje:</strong> Ceremonia por la cual los nobles juraban fidelidad al rey y se convertían en sus vasallos.</p>
                                    <p><strong>Servicio a Cambio:</strong> El vasallo recibía el derecho a usar y beneficiarse de la tierra, pero debía un servicio al propietario. Este servicio podía ser <strong>militar</strong> (típico de un caballero) o bien, un <strong>pago</strong> (en dinero o productos) o una renta fija.</p>

                                    <h3>V. Vida en el Sistema Feudal</h3>
                                    <p><strong>Castillo:</strong> Vida guerrera con torneos, fiestas y ceremonias como la del homenaje.</p>
                                    <p><strong>Monasterio:</strong> Vida tranquila y de recogimiento. Los monjes se dedicaban a la oración, el trabajo en sus huertos y el estudio, copiando libros.</p>
                                    <p><strong>Aldeas:</strong> Los campesinos vivían en casas sencillas, sufrían frecuentes enfermedades y se dedicaban a labrar sus pequeñas tierras y las de su señor. Pagaban el diezmo a la Iglesia.</p>

                                    <h3>VI. Fin del Feudalismo</h3>
                                    <p>El feudalismo decayó a medida que la sociedad se hizo <strong>más compleja</strong> y la relación entre señores y vasallos se volvió menos directa.</p>
                                    <p>Otras causas del declive incluyeron el <strong>descenso de la población</strong> y el <strong>creciente uso del dinero</strong> para pagar en lugar de una promesa de servicio.</p>

                                    <div class="mt-12 text-center">
                                        <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg quiz-option-btn" data-quiz-start="feudalismo">
                                            Tomar el Quiz de Feudalismo &rarr;
                                        </button>
                                    </div>
                                </div>
                            `
                        },
                        'iglesia': {
                            title: 'La Iglesia en la Edad Media',
                            content: `
                                <div class="prose prose-custom" id="topic-text-iglesia">
                                    <div class="bg-blue-50 border-l-4 border-blue-400 p-6 rounded-lg mb-8">
                                        <h3 class="mt-0 text-blue-800">Video Informativo</h3>
                                        <p class="text-blue-700">Video sobre el poder de la Iglesia Medieval.</p>
                                        <a href="https://github.com/luisonyturbe/historia/raw/main/Poder_de_la_Iglesia_Medieval.mov" target="_blank" rel="noopener noreferrer" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-5 rounded-lg transition-colors">
                                            Ver Video
                                        </a>
                                    </div>
                                    
                                    <h2>Plan de Estudio: La Iglesia Católica en la Edad Media</h2>
                                    
                                    <h3>I. Contexto y Rol Estructural del Catolicismo</h3>
                                    <p><strong>La Iglesia como Fuerza Unificadora:</strong> A pesar de que Europa medieval estaba políticamente fragmentada, la Iglesia Católica se convirtió en una <strong>fuerza unificadora de Occidente</strong>. Mantuvo unido lo que quedaba del antiguo Imperio Romano e inició un proceso de <strong>reestructuración y jerarquización interna</strong>.</p>
                                    
                                    <h4>Jerarquía de la Iglesia:</h4>
                                    <p>La estructura jerarquizada le otorgó una ventaja frente a los cambiantes reinos germánicos.</p>
                                    <ul>
                                        <li><strong>Papa:</strong> Era el líder que gobernaba la Iglesia, fungiendo como jefe político en los territorios de la Iglesia y líder espiritual.</li>
                                        <li><strong>Clero:</strong> (Monjes y sacerdotes) estaba consagrado a la actividad religiosa.</li>
                                        <li>La jerarquía se organizaba en: <strong>Papa</strong> &rarr; <strong>Arzobispos</strong> (entregaban directrices a obispos) &rarr; <strong>Obispos</strong> (fiscalizaban a sacerdotes) &rarr; <strong>Sacerdotes</strong> (responsables de sus parroquias).</li>
                                    </ul>

                                    <h4>Alianzas Políticas y Poder Pontificio:</h4>
                                    <p>La Iglesia estableció <strong>lazos políticos importantes con los monarcas germanos</strong>. Se forjó una alianza mutua con los Francos, resultando en la expansión del cristianismo y la formación de <strong>Los Estados Pontificios</strong>.</p>
                                    <p>El poder del Papa era tal que podía <strong>excomulgar a los reyes</strong> que desafiaran su autoridad, dejándolos fuera de la ley. El clero actuaba como colaborador directo.</p>

                                    <h3>II. Poder Económico de la Iglesia</h3>
                                    <p><strong>Riqueza y Propiedad de la Tierra:</strong> Durante la Edad Media, la Iglesia Católica recibió <strong>vastas tierras</strong> concedidas por reyes y terratenientes. Recibió grandes ingresos que la hicieron extremadamente rica, aumentando su poder e influencia.</p>
                                    <p><strong>El Rol de los Monasterios:</strong> Los monasterios eran <strong>grandes propietarios de tierras</strong>. Los campesinos trabajaban en ellas y pagaban rentas. Generaban riqueza con la producción de vino, cerveza, queso y otros alimentos.</p>

                                    <h3>III. Rol Social y Cultural</h3>
                                    <h4>Educación y Conocimiento:</h4>
                                    <p>En los monasterios surgieron <strong>escuelas monásticas y catedrales</strong> donde se enseñaba a leer, escribir y estudiar la Biblia. Los monjes conservaron muchos conocimientos de Grecia y Roma (filosofía, medicina, matemáticas e historia).</p>
                                    <p>Los monasterios fueron los <strong>primeros centros de bibliotecas de Europa</strong> y enseñaban nuevas <strong>técnicas agrícolas</strong> (rotación de cultivos, molinos de agua). De los monasterios surgieron <strong>Universidades medievales</strong> (como Bolonia, París, Oxford).</p>
                                    
                                    <h4>Órdenes Religiosas y Funciones Sociales:</h4>
                                    <p>La Iglesia se dedicaba a la transmisión de la doctrina cristiana y la administración de sacramentos.</p>
                                    <ul>
                                        <li><strong>Franciscanos:</strong> Vivían en pobreza, predicaban en las ciudades y ayudaban a los pobres.</li>
                                        <li><strong>Dominicos:</strong> Se dedicaban a la enseñanza y a combatir las herejías.</li>
                                        <li><strong>Cistercienses:</strong> Promovieron la agricultura y el comercio.</li>
                                    </ul>

                                            Tomar el Quiz de La Iglesia &rarr;

                                <div class="prose prose-custom" id="topic-text-cruzadas">

                                        <h3 class="mt-0 text-blue-800">Video Informativo</h3>

                                    <h2>Plan de Estudio: Las Cruzadas (Siglos XI-XIII)</h2>

                                    <h3>I. Definición y Contexto Histórico</h3>
                                    <p><strong>Definición:</strong> Las Cruzadas fueron un <strong>peregrinaje armado</strong>, una mezcla de fe, esperanza y guerra.</p>
                                    <p><strong>Inicio:</strong> Todo comenzó en <strong>1095</strong>.</p>
                                    <p><strong>Símbolo:</strong> Una <strong>cruz roja</strong> cosida en la capa, símbolo de la misión y el sacrificio.</p>
                                    <p><strong>Objetivo Primario:</strong> Rescatar los <strong>Lugares Santos</strong> y <strong>Jerusalén</strong> (la ciudad más sagrada).</p>

                                    <h3>II. Causas y Motivaciones</h3>
                                    <p><strong>El Llamado de la Iglesia:</strong> El <strong>Papa Urbano II</strong> convocó a los cristianos a marchar hacia Jerusalén.</p>
                                    <p><strong>Petición de Auxilio:</strong> El emperador bizantino <strong>Alejo I Comneno</strong> solicitó ayuda a Occidente.</p>
                                    <p><strong>Incentivo Religioso:</strong> A los participantes se les prometió el <strong>perdón de sus pecados</strong> y la <strong>salvación asegurada</strong>.</p>
                                    <p><strong>Motivaciones Diversas:</strong></p>
                                    <ul>
                                        <li>Fe y devoción religiosa.</li>
                                        <li>Búsqueda de <strong>riquezas, tierras o fama</strong>.</li>
                                        <li>Deseo de escapar de la pobreza.</li>
                                        <li>Oportunidad para jóvenes caballeros de <strong>mostrar su valor</strong>.</li>

                                        <tbody>

                                                <td><strong>Primera Cruzada</strong></td>
                                                <td>1096</td>
                                                <td>Godofredo de Bouillón, Raimundo de Tolosa, Bohemundo de Tarento.</td>
                                                <td><strong>Conquista de Jerusalén en 1099</strong> y fundación de reinos cristianos en Tierra Santa.</td>
                                            </tr>
                                            <tr>
                                                <td><strong>Batalla de Cuernos de Hattin</strong></td>
                                                <td>1187</td>
                                                <td><strong>Saladino</strong> (Sultán de Egipto y Siria).</td>
                                                <td>Saladino unió a los musulmanes y <strong>recuperó Jerusalén</strong>.</td>
                                            </tr>
                                            <tr>
                                                <td><strong>Tercera Cruzada</strong></td>
                                                <td>1189–1192</td>
                                                <td><strong>Ricardo Corazón de León</strong> (rey inglés).</td>

                                            </tr>
                                        </tbody>
                                    </table>

                                    <h3>IV. Consecuencias y Legado</h3>
                                    <p><strong>Para los Cristianos (Resultados Agridulces):</strong> La mayoría de las expediciones <strong>fracasaron</strong>. La desunión entre los reyes y nobles debilitó la causa.</p>

                                    <h2>Plan de Estudio: El Surgimiento del Estado Moderno y el Mercantilismo (Siglos XV-XVIII)</h2>

                                    <h3>I. El Surgimiento y Contexto Histórico</h3>
                                    <p><strong>Periodo:</strong> El Estado moderno se formó principalmente entre los <strong>siglos XV y XVI</strong>.</p>
                                    <p><strong>Causa Principal:</strong> Los monarcas capitalizaron la <strong>crisis del feudalismo</strong> para <strong>recuperar y centralizar su autoridad</strong>.</p>
                                    <p><strong>Impulso Cultural:</strong> El proceso recibió un impulso significativo durante el <strong>Renacimiento</strong>.</p>

                                    <h3>II. Ideas Clave y Características del Estado Moderno</h3>
                                    <p>El Estado moderno se caracteriza por:</p>
                                    <ul>
                                        <li><strong>Centralización del Poder:</strong> Un gobierno centralizado que ejerce control sobre el territorio y las leyes.</li>
                                        <li><strong>Territorio Definido:</strong> Fronteras definidas esenciales para la <strong>soberanía</strong> y el control de recursos.</li>
                                        <li><strong>Legitimación del Poder Monárquico:</strong> El poder se legitimaba por medio del ejército y, en monarquías absolutas, por el <strong>derecho divino</strong>.</li>
                                        <li><strong>Aparato Administrativo:</strong> Un aparato eficiente para implementar políticas y manejar recursos.</li>
                                        <li><strong>Ejército Nacional Profesional:</strong> Un ejército permanente que asegura la soberanía.</li>
                                        <li><strong>Política Diplomática:</strong> Búsqueda de <strong>relaciones internacionales</strong> mediante negociación.</li>
                                    </ul>

                                    <h3>III. El Papel Fundamental de la Burguesía</h3>
                                    <p><strong>Ascenso y Apoyo:</strong> La burguesía emergió como clase social clave, <strong>apoyando la centralización del poder</strong> real.</p>
                                    <p><strong>Motor de Crecimiento:</strong> Su fortalecimiento fue impulsado por la <strong>industria</strong> (manufacturas, textiles) y el <strong>comercio</strong> (especias, metales preciosos).</p>
                                    <p><strong>Influencia Política y Económica:</strong> La burguesía buscó <strong>influir en las decisiones políticas</strong> (leyes) y económicas.</p>

                                    <h3>IV. Formas de Gobierno del Estado Moderno</h3>
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Tipo de Estado</th>
                                                <th>Periodo Clave</th>
                                                <th>Características</th>
                                                <th>Ejemplos</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td><strong>Monarquías Nacionales</strong></td>
                                                <td>Siglo XV-XVI</td>
                                                <td>Consolidación del poder real, <strong>debilitando el poder feudal</strong>, apoyadas por la burguesía.</td>
                                                <td>Luis XIV en Francia; Isabel y Fernando de Castilla en España.</td>
                                            </tr>
                                            <tr>
                                                <td><strong>Monarquías Absolutas</strong></td>
                                                <td>[Implícito]</td>
                                                <td>Legitimadas por el <strong>Derecho Divino</strong>, otorgando poder absoluto al rey.</td>
                                                <td>[Implícito en Monarquías Nacionales]</td>
                                            </tr>
                                            <tr>
                                                <td><strong>Monarquías Parlamentarias</strong></td>
                                                <td>Siglo XVII-XVIII</td>
                                                <td>El rey existe, pero <strong>no gobierna de forma absoluta</strong>. El Parlamento adquiere más poder.</td>
                                                <td>Países Bajos y Suecia.</td>
                                            </tr>
                                            <tr>
                                                <td><strong>Ciudades-Estado</strong></td>
                                                <td>Siglo XVI-XVIII</td>
                                                <td>Gobernadas por <strong>familias poderosas</strong> (autónomas), organizadas como repúblicas.</td>
                                                <td>Venecia y Florencia.</td>
                                            </tr>
                                        </tbody>
                                    </table>

                                    <h3>V. Mercantilismo: La Doctrina Económica</h3>
                                    <p><strong>Definición:</strong> Conjunto de ideas que buscaban <strong>fortalecer el poder del Estado</strong> mediante el control del comercio y la <strong>acumulación de riqueza</strong>.</p>
                                    <p><strong>Riqueza Central:</strong> La riqueza se buscaba especialmente en forma de <strong>metales preciosos</strong> (oro y plata).</p>
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Características Clave</th>
                                                <th>Periodo de Desarrollo</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td><strong>Acumulación de Metales Preciosos:</strong> Fundamental para el enriquecimiento del Estado.</td>
                                                <td><strong>Siglo XVI:</strong> Surgimiento del mercantilismo y auge de la colonización en América.</td>
                                            </tr>
                                            <tr>
                                                <td><strong>Intervención Estatal:</strong> El Estado regula el comercio, maximizando las <strong>exportaciones</strong>.</td>
                                                <td><strong>Siglo XVII:</strong> Consolidación del mercantilismo.</td>
                                            </tr>
                                            <tr>
                                                <td><strong>Creación de Impuestos:</strong> Promoción de impuestos sobre la <strong>exportación e importación</strong>.</td>

                                    <h3>III. Ciencia y Descubrimientos</h3>

                            { q: "¿Quién inventó la 'imprenta de tipos móviles'?", a: ["Galileo Galilei", "Nicolás Copérnico", "Andreas Vesalio", "Johannes Gutenberg"], c: 3 },
                            { q: "¿Quién escribió 'Don Quijote de la Mancha', considerada la primera novela moderna?", a: ["William Shakespeare", "Nicolás Maquiavelo", "Miguel de Cervantes Saavedra", "Dante Alighieri"], c: 2 }
                        ]
                    }

            },
            methods: {
                
                async generateNewQuestions() {
                    if (this.isLoading) return;
                    this.isLoading = true;
                    this.renderPage(); // Para mostrar estado 'cargando' en el botón

                    try {
                        const topicText = document.getElementById(`topic-text-${this.quizType}`).innerText;
                        // Prompt actualizado a español
                        const prompt = `Basado en el siguiente texto sobre ${this.topics[this.quizType].title}, genera 5 nuevas y únicas preguntas de examen de opción múltiple. Asegúrate que la respuesta sea únicamente un array JSON válido de objetos. Cada objeto debe tener las claves 'q' (string), 'a' (array de 4 strings), y 'c' (índice entero de la respuesta correcta).`;

                        const payload = {
                            contents: [{ 
                                role: "user", 
                                parts: [
                                    { text: `Texto de referencia:\n${topicText}` },
                                    { text: prompt }
                                ] 
                            }],
                            generationConfig: {
                                responseMimeType: "application/json",
                                responseSchema: {
                                    type: "ARRAY",
                                    items: {
                                        type: "OBJECT",
                                        properties: {
                                            "q": { "type": "STRING" },
                                            "a": { "type": "ARRAY", "items": { "type": "STRING" } },
                                            "c": { "type": "INTEGER" }
                                        },
                                        required: ["q", "a", "c"]
                                    }
                                }
                            }
                        };
                        const apiKey = ""; // Dejar vacío
                        // Modelo actualizado
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                        
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (!response.ok) {
                            throw new Error(`Error en la API: ${response.statusText}`);
                        }

                        const result = await response.json();
                        
                        if (result.candidates && result.candidates[0].content && result.candidates[0].content.parts[0].text) {
                            const newQuestions = JSON.parse(result.candidates[0].content.parts[0].text);
                            this.questions = newQuestions.map(q => ({...q, topic: this.quizType}));
                            this.currentQuestionIndex = 0;
                            this.score = 0;
                            this.userAnswers = [];
                            this.selectedAnswer = null;
                            this.currentPage = 'quiz-active';
                        } else {
                            throw new Error("No se pudieron generar nuevas preguntas.");
                        }

                    } catch (error) {
                        console.error("Error generando nuevas preguntas:", error);
                        alert("Lo sentimos, no pudimos generar nuevas preguntas en este momento. Por favor, inténtalo de nuevo.");
                    } finally {
                        this.isLoading = false;
                        this.renderPage();
                    }
                },

                // Lógica TTS actualizada para buscar voz en español
                loadVoices() {
                    this.voices = window.speechSynthesis.getVoices();
                },
                
                toggleReading() {
                    if (!('speechSynthesis' in window)) {
                        alert('Lo sentimos, tu navegador no soporta la lectura de texto.');
                        return;
                    }

                    // Si ya está hablando, cancelar
                    if (this.isReading) {
                        window.speechSynthesis.cancel();
                        this.isReading = false;
                        this.renderPage();
                        return;
                    }
                    
                    // Obtener el texto del tema actual
                    const topicTextElement = document.getElementById(`topic-text-${this.currentTopic}`);
                    if (!topicTextElement) return;

                    const textToRead = topicTextElement.innerText;
                    const utterance = new SpeechSynthesisUtterance(textToRead);

                    // --- INICIO DE LA LÓGICA DE VOZ MEJORADA ---
                    
                    // Priorizar voces: 'es-MX', luego 'es-ES', luego cualquier 'es'
                    const spanishVoice = 
                        this.voices.find(voice => voice.lang === 'es-MX') || 
                        this.voices.find(voice => voice.lang === 'es-ES') || 
                        this.voices.find(voice => voice.lang.startsWith('es-'));

                    if (spanishVoice) {
                        utterance.voice = spanishVoice;
                        utterance.lang = spanishVoice.lang;
                    } else {
                        // Fallback si no se encuentra ninguna voz específica
                        utterance.lang = 'es-ES'; 
                        console.warn("No se encontró una voz TTS en español. Usando la voz predeterminada del navegador para 'es'.");
                    }
                    // --- FIN DE LA LÓGICA DE VOZ ---

                    utterance.onstart = () => {
                        this.isReading = true;
                        this.renderPage(); // Actualizar botón a "Detener"
                    };

                    utterance.onend = () => {
                        this.isReading = false;
                        this.renderPage(); // Actualizar botón a "Leer..."
                    };
                    
                    utterance.onerror = (event) => {
                        console.error('Error en SpeechSynthesisUtterance:', event);
                        if (event.error === 'language-unavailable') {
                            alert('No se pudo encontrar una voz en español en tu navegador. La lectura podría no funcionar o sonar incorrecta.');
                        }
                        this.isReading = false;
                        this.renderPage();
                    };

                    window.speechSynthesis.speak(utterance);
                },
                
                // --- Renderizado de Páginas ---
                navigate(page, topic = null) {
                    // Detener cualquier lectura al navegar
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                    }
                    this.isReading = false;

                    this.currentPage = page;
                    this.currentTopic = topic;
                    window.scrollTo(0, 0);
                    this.renderPage();
                },
                startQuiz(type) {
                     if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                    }
                    this.isReading = false;
                    
                    this.quizType = type;
                    this.currentQuestionIndex = 0;
                    this.score = 0;
                    this.userAnswers = [];
                    this.selectedAnswer = null; // Reiniciar selección

                    if (type === 'all') {
                        // Obtener 20 preguntas de todos los temas
                        let allQuestions = [];
                        Object.keys(this.quizQuestions).forEach(topic => {
                            this.quizQuestions[topic].forEach(q => {
                                allQuestions.push({ ...q, topic: topic });
                            });
                        });
                        this.questions = this.shuffleArray(allQuestions).slice(0, 20);
                    } else {
                        // Obtener 10 preguntas del tema seleccionado
                        const topicQuestions = this.quizQuestions[type].map(q => ({...q, topic: type}));
                        this.questions = this.shuffleArray(topicQuestions).slice(0, 10);
                    }
                    this.currentPage = 'quiz-active';
                    this.renderPage();
                },
                selectAnswer(choiceIndex) {
                    this.selectedAnswer = choiceIndex;
                    this.renderPage(); // Volver a renderizar para mostrar la selección
                },
                nextQuestion() {
                    if (this.selectedAnswer === null) return; // No hacer nada si no se ha seleccionado

                    const currentQuestion = this.questions[this.currentQuestionIndex];
                    const isCorrect = this.selectedAnswer === currentQuestion.c;
                    if (isCorrect) {
                        this.score++;
                    }
                    this.userAnswers.push({
                        question: currentQuestion.q,
                        answer: currentQuestion.a[this.selectedAnswer],
                        correctAnswer: currentQuestion.a[currentQuestion.c],
                        isCorrect: isCorrect,
                        topic: currentQuestion.topic
                    });

                    this.selectedAnswer = null; // Reiniciar para la siguiente pregunta

                    if (this.currentQuestionIndex < this.questions.length - 1) {
                        this.currentQuestionIndex++;
                    } else {
                        this.currentPage = 'quiz-results';
                    }
                    this.renderPage();
                },
                getResultsFeedback() {
                    // Esta función solo da feedback para el examen general
                    if (this.quizType !== 'all') return '';

                    const incorrectAnswers = this.userAnswers.filter(a => !a.isCorrect);
                    if (incorrectAnswers.length === 0) {
                        return '<p class="text-green-600 font-semibold">¡Excelente trabajo! Puntuación perfecta. Tienes un gran dominio de todos los temas.</p>';
                    }

                    const topicErrors = {};
                    incorrectAnswers.forEach(answer => {
                        if (!topicErrors[answer.topic]) {
                            topicErrors[answer.topic] = 0;
                        }
                        topicErrors[answer.topic]++;
                    });

                    // Identificar áreas débiles (2 o más errores en un tema)
                    const weakAreas = Object.keys(topicErrors).filter(topic => topicErrors[topic] >= 2);

                    if (weakAreas.length > 0) {
                        let feedback = '<p class="font-semibold text-lg mb-2">Sugerencias:</p><p>Basado en tus resultados, te recomendamos repasar los siguientes temas:</p><ul class="list-disc list-inside mt-2 text-left">';
                        weakAreas.forEach(topic => {
                            feedback += `<li class="capitalize">${this.topics[topic].title}</li>`;
                        });
                        feedback += '</ul><p class="mt-2">¡Considera repasar las guías de estudio y tomar los quizzes específicos de esos temas!</p>';
                        return feedback;
                    }

                    return '<p>¡Buen trabajo! Tienes un entendimiento sólido. Revisa las preguntas que fallaste para afinar tu conocimiento.</p>';
                },
                shuffleArray(array) {
                    for (let i = array.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [array[i], array[j]] = [array[j], array[i]];
                    }
                    return array;
                },
                renderPage() {
                    const appEl = document.getElementById('app');
                    
                    switch (this.currentPage) {
                        case 'home':
                            appEl.innerHTML = this.HomePage();
                            break;
                        case 'topic':
                            appEl.innerHTML = this.TopicPage();
                            break;
                        case 'quiz':
                            appEl.innerHTML = this.QuizPage();
                            break;
                        case 'quiz-active':
                            appEl.innerHTML = this.QuizActivePage();
                            break;
                        case 'quiz-results':
                             appEl.innerHTML = this.QuizResultsPage();
                             break;
                        default:
                            appEl.innerHTML = this.HomePage();
                    }
                     this.addEventListeners();
                },
                addEventListeners() {
                    // Navegación estándar
                    document.querySelectorAll('[data-navigate]').forEach(el => {
                        el.addEventListener('click', (e) => {
                            const page = e.currentTarget.getAttribute('data-navigate');
                            const topic = e.currentTarget.getAttribute('data-topic');
                            window.app.navigate(page, topic); // Usar window.app
                        });
                    });
                    // Empezar Quiz
                     document.querySelectorAll('[data-quiz-start]').forEach(el => {
                        el.addEventListener('click', (e) => {
                            const type = e.currentTarget.getAttribute('data-quiz-start');
                            window.app.startQuiz(type); // Usar window.app
                        });
                    });
                    // Seleccionar respuesta de Quiz
                    document.querySelectorAll('[data-answer]').forEach(el => {
                        el.addEventListener('click', (e) => {
                            const choiceIndex = parseInt(e.currentTarget.getAttribute('data-answer'));
                            window.app.selectAnswer(choiceIndex); // Usar window.app
                        });
                    });
                    // Siguiente pregunta
                    const nextBtn = document.getElementById('next-question-btn');
                    if (nextBtn) {
                        nextBtn.addEventListener('click', () => window.app.nextQuestion()); // Usar window.app
                    }
                    // Funciones de IA
                    const newQuestionsBtn = document.getElementById('new-questions-btn');
                    if(newQuestionsBtn) newQuestionsBtn.addEventListener('click', () => window.app.generateNewQuestions()); // Usar window.app
                    
                    const ttsBtn = document.getElementById('tts-btn');
                    if (ttsBtn) ttsBtn.addEventListener('click', () => window.app.toggleReading()); // Usar window.app
                },

                                    <p class="text-7xl font-bold text-indigo-600">${this.score} / ${this.questions.length}</p>
                                </div>
                                
                                ${this.quizType === 'all' ? `<div class="bg-blue-50 border-l-4 border-blue-400 p-6 rounded-r-lg my-8 text-center">${feedbackHtml}</div>` : ''}

                                <h2 class="text-2xl font-semibold mt-8 mb-5">Revisa tus Respuestas:</h2>
                                <div class="space-y-4">
                                    ${resultsHtml}
                                </div>
                                <div class="mt-8 flex flex-col sm:flex-row justify-center items-center gap-4 flex-wrap">
                                    <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg quiz-option-btn w-full sm:w-auto" data-quiz-start="${this.quizType}">
                                        Intentar de Nuevo
                                    </button>
                                     <button class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-6 rounded-lg quiz-option-btn w-full sm:w-auto" data-navigate="quiz">
                                         Elegir otro Quiz
                                     </button>
                                    ${newQuestionsButtonHtml}
                                </div>
                            </div>
                        </div>
                    `;
                }
            },
            mounted() {
                // Función de autoinvocación para montar la app
                this.renderPage();
                
                // Cargar las voces de TTS
                if ('speechSynthesis' in window) {
                    this.loadVoices();
                    // Algunos navegadores cargan las voces de forma asíncrona
                    if (window.speechSynthesis.onvoiceschanged !== undefined) {
                        window.speechSynthesis.onvoiceschanged = () => this.loadVoices();
                    }
                }
            }
        };

        // Simulación de un montaje simple tipo "Vanilla JS"
        (function(config) {
            const app = {};
            // Copiar data
            Object.assign(app, config.data());
            // Vincular métodos
            for (const methodName in config.methods) {
                app[methodName] = config.methods[methodName].bind(app);
            }
            // Asignar al objeto global para que los event listeners puedan encontrarlo
            window.app = app; 
            // Llamar a mounted
            config.mounted.call(app);

            // Re-definir addEventListeners para usar el 'window.app'
            // Esto es un hack para un SPA sin un framework real
            app.addEventListeners = function() {
                document.querySelectorAll('[data-navigate]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        const page = e.currentTarget.getAttribute('data-navigate');
                        const topic = e.currentTarget.getAttribute('data-topic');
                        window.app.navigate(page, topic);
                    });
                });
                 document.querySelectorAll('[data-quiz-start]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        const type = e.currentTarget.getAttribute('data-quiz-start');
                        window.app.startQuiz(type);
                    });
                });
                document.querySelectorAll('[data-answer]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        const choiceIndex = parseInt(e.currentTarget.getAttribute('data-answer'));
                        window.app.selectAnswer(choiceIndex);
                    });
                });
                const nextBtn = document.getElementById('next-question-btn');
                if (nextBtn) {
                    nextBtn.addEventListener('click', () => window.app.nextQuestion());
                }
                const newQuestionsBtn = document.getElementById('new-questions-btn');
                if(newQuestionsBtn) newQuestionsBtn.addEventListener('click', () => window.app.generateNewQuestions());
                
                const ttsBtn = document.getElementById('tts-btn');
                if (ttsBtn) ttsBtn.addEventListener('click', () => window.app.toggleReading());
            };
            
            // Re-renderizar después de la configuración inicial para asegurar que los listeners
            // de 'window.app' estén disponibles.
            app.renderPage();

        })(appConfig);
    </script>
</body>
</html>
